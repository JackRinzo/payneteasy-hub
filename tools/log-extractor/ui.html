<style>
  .tool-form {
    display: grid;
    gap: 12px;
    max-width: 620px;
  }

  .tool-form label {
    display: grid;
    gap: 6px;
    font-size: 13px;
    color: #c8d4f2;
  }

  .tool-form input,
  .tool-form select {
    background: #0f1628;
    border: 1px solid #324572;
    color: #e8eefc;
    border-radius: 8px;
    padding: 10px 11px;
    font-size: 13px;
  }

  .tool-form button {
    justify-self: start;
    border: 1px solid #4b6cb1;
    background: #26406c;
    color: #e8eefc;
    border-radius: 8px;
    padding: 9px 14px;
    cursor: pointer;
    font-size: 13px;
  }

  .tool-note {
    margin: 0;
    color: #9eb0d8;
    font-size: 12px;
  }
</style>

<form class="tool-form">
  <label>
    Mode
    <select name="mode" required>
      <option value="merchant">Merchant logs</option>
      <option value="processor">Processor logs</option>
    </select>
  </label>

  <label>
    Processor name (optional, processor mode)
    <input name="processorName" type="text" placeholder="e.g. checkout.com" />
  </label>

  <label>
    Gate ID (optional, processor mode)
    <input name="gateId" type="text" placeholder="e.g. 12345" />
  </label>

  <label style="display:flex; align-items:center; gap:8px; color:#c8d4f2;">
    <input type="checkbox" data-download-output="true" checked />
    Download output as .txt
  </label>

  <button type="submit" data-default-action="true">Extract Logs</button>
  <p class="tool-note">The tool scrolls the full log page first, then extracts matching blocks.</p>
</form>
