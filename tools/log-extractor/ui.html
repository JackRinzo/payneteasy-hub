<style>
  .tool-form {
    display: grid;
    gap: 6px;
    max-width: 100%;
  }

  .tool-form label {
    display: grid;
    gap: 3px;
    font-size: 12px;
    color: #184374;
  }

  .tool-form input,
  .tool-form select {
    background: #f8fbff;
    border: 1px solid #bfd8fb;
    color: #173d6d;
    border-radius: 7px;
    padding: 6px 8px;
    font-size: 12px;
  }

  .tool-form button {
    justify-self: start;
    border: 1px solid #3b78d9;
    background: linear-gradient(180deg, #4f90ef 0%, #3e7fe0 100%);
    color: #ffffff;
    border-radius: 7px;
    padding: 7px 12px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    box-shadow: 0 4px 10px rgba(49, 111, 209, 0.26);
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
  }

  .tool-form button:hover {
    filter: brightness(1.03);
    box-shadow: 0 6px 12px rgba(49, 111, 209, 0.34);
  }

  .tool-form button:active {
    transform: translateY(1px);
  }

  .tool-note {
    margin: 0;
    color: #5c7eaa;
    font-size: 11px;
    line-height: 1.2;
  }
</style>

<form class="tool-form">
  <label>
    Mode
    <select name="mode" id="modeSelect" required>
      <option value="merchant">Merchant logs</option>
      <option value="processor">Processor logs</option>
    </select>
  </label>

  <label id="processorNameField">
    Processor name (optional)
    <input name="processorName" type="text" placeholder="pay2playProcessor" />
  </label>

  <label id="gateIdField">
    Gate ID (optional)
    <input name="gateId" type="text" placeholder="426257" />
  </label>

  <label>
    File name
    <input name="fileName" type="text" placeholder="example_logs" required />
  </label>

  <button type="submit" data-default-action="true">Extract Logs</button>
  <p class="tool-note">The tool scrolls the full log page first, then extracts matching blocks.</p>
</form>
