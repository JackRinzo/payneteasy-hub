<style>
  .tool-form {
    display: grid;
    gap: 6px;
    max-width: 100%;
  }

  .tool-form label {
    display: grid;
    gap: 3px;
    font-size: 12px;
    color: #c8d4f2;
  }

  .tool-form input,
  .tool-form select {
    background: #0f1628;
    border: 1px solid #324572;
    color: #e8eefc;
    border-radius: 7px;
    padding: 6px 8px;
    font-size: 12px;
  }

  .tool-form button {
    justify-self: start;
    border: 1px solid #4b6cb1;
    background: #26406c;
    color: #e8eefc;
    border-radius: 7px;
    padding: 7px 11px;
    cursor: pointer;
    font-size: 12px;
  }

  .tool-note {
    margin: 0;
    color: #9eb0d8;
    font-size: 11px;
    line-height: 1.2;
  }
</style>

<form class="tool-form">
  <label>
    Mode
    <select name="mode" id="modeSelect" required>
      <option value="merchant">Merchant logs</option>
      <option value="processor">Processor logs</option>
    </select>
  </label>

  <label id="processorNameField">
    Processor name (optional)
    <input name="processorName" type="text" placeholder="pay2playProcessor" />
  </label>

  <label id="gateIdField">
    Gate ID (optional)
    <input name="gateId" type="text" placeholder="426257" />
  </label>

  <label>
    File name
    <input name="fileName" type="text" placeholder="example_logs" required />
  </label>

  <button type="submit" data-default-action="true">Extract Logs</button>
  <p class="tool-note">The tool scrolls the full log page first, then extracts matching blocks.</p>
</form>

<script>
  (function () {
    const modeSelect = document.getElementById("modeSelect");
    const processorNameField = document.getElementById("processorNameField");
    const gateIdField = document.getElementById("gateIdField");

    function syncModeFields() {
      const isProcessorMode = modeSelect.value === "processor";
      processorNameField.style.display = isProcessorMode ? "grid" : "none";
      gateIdField.style.display = isProcessorMode ? "grid" : "none";
    }

    modeSelect.addEventListener("change", syncModeFields);
    syncModeFields();
  })();
</script>
