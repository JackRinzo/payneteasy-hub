<style>
  .tool-form {
    display: grid;
    gap: 12px;
    max-width: 560px;
  }

  .tool-form label {
    display: grid;
    gap: 6px;
    font-size: 13px;
    color: #c8d4f2;
  }

  .tool-form input,
  .tool-form select {
    background: #0f1628;
    border: 1px solid #324572;
    color: #e8eefc;
    border-radius: 8px;
    padding: 10px 11px;
    font-size: 13px;
  }

  .tool-form button {
    justify-self: start;
    border: 1px solid #4b6cb1;
    background: #26406c;
    color: #e8eefc;
    border-radius: 8px;
    padding: 9px 14px;
    cursor: pointer;
    font-size: 13px;
  }

  .tool-note {
    margin: 0;
    color: #9eb0d8;
    font-size: 12px;
  }
</style>

<form class="tool-form">
  <label>
    New first word
    <input name="word" type="text" placeholder="e.g. QA-GATE" required />
  </label>

  <label>
    Currency (optional)
    <input name="currency" type="text" maxlength="3" placeholder="e.g. EUR" />
  </label>

  <button type="submit" data-default-action="true">Rename Gates</button>
  <p class="tool-note">Applies changes in the currently active Clone Project table.</p>
</form>
