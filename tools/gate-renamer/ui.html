<style>
  .tool-form {
    display: grid;
    gap: 7px;
    max-width: 100%;
  }

  .tool-form label {
    display: grid;
    gap: 4px;
    font-size: 12px;
    color: #184374;
  }

  .tool-form input,
  .tool-form select {
    background: #f8fbff;
    border: 1px solid #bfd8fb;
    color: #173d6d;
    border-radius: 7px;
    padding: 7px 9px;
    font-size: 12px;
  }

  .tool-form button {
    justify-self: start;
    border: 1px solid #3b78d9;
    background: linear-gradient(180deg, #4f90ef 0%, #3e7fe0 100%);
    color: #ffffff;
    border-radius: 7px;
    padding: 7px 12px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    box-shadow: 0 4px 10px rgba(49, 111, 209, 0.26);
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
  }

  .tool-form button:hover {
    filter: brightness(1.03);
    box-shadow: 0 6px 12px rgba(49, 111, 209, 0.34);
  }

  .tool-form button:active {
    transform: translateY(1px);
  }

  .tool-note {
    margin: 0;
    color: #5c7eaa;
    font-size: 11px;
    line-height: 1.2;
  }
</style>

<form class="tool-form">
  <label>
    New first word
    <input name="word" type="text" placeholder="e.g. QA-GATE" required />
  </label>

  <label>
    Currency (optional)
    <input name="currency" type="text" maxlength="3" placeholder="e.g. EUR" />
  </label>

  <button type="submit" data-default-action="true">Rename Gates</button>
  <p class="tool-note">Applies changes in the currently active Clone Project table.</p>
</form>
