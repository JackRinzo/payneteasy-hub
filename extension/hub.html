<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaynetEasy Support Hub</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-main: #0e1422;
        --bg-panel: #141d31;
        --bg-elevated: #1c2740;
        --bg-active: #26365a;
        --text-main: #e8eefc;
        --text-muted: #a9b7d7;
        --ok: #86efac;
        --error: #fda4af;
        --accent: #60a5fa;
        --border: #2b3b62;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        position: relative;
        font-family: "Segoe UI", Arial, sans-serif;
        background: var(--bg-main);
        color: var(--text-main);
        width: 360px;
        height: 480px;
        overflow: hidden;
      }

      .layout {
        width: 360px;
        height: 480px;
        display: grid;
        grid-template-columns: 60px 1fr;
        position: relative;
        z-index: 1;
      }

      .sidebar {
        border-right: 1px solid var(--border);
        background: var(--bg-panel);
        padding: 8px 6px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .tool-tab {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-main);
        border-radius: 8px;
        padding: 8px 4px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 10px;
      }

      .tool-tab:hover {
        background: var(--bg-elevated);
      }

      .tool-tab.active {
        background: var(--bg-active);
        border-color: #3d5690;
      }

      .tool-icon {
        font-size: 16px;
        line-height: 1;
      }

      .main {
        padding: 8px;
        overflow: hidden;
      }

      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }

      .title {
        margin: 0;
        font-size: 13px;
      }

      .subtitle {
        margin: 2px 0 0;
        color: var(--text-muted);
        font-size: 11px;
        line-height: 1.25;
      }

      .panel {
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px;
      }

      .status {
        margin-top: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 8px;
        background: var(--bg-elevated);
        font-size: 12px;
        min-height: 30px;
        display: flex;
        align-items: center;
      }

      .status.ok {
        color: var(--ok);
      }

      .status.error {
        color: var(--error);
      }

      .status.info {
        color: var(--text-muted);
      }

      .badge {
        font-size: 11px;
        color: var(--text-muted);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px 8px;
        max-width: 148px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .loading {
        color: var(--text-muted);
      }

      .footer {
        position: absolute;
        bottom: 4px;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 10px;
        color: #6f7fa7;
        pointer-events: none;
        z-index: 1;
      }

      .watermark {
        position: absolute;
        right: -26px;
        bottom: 18px;
        width: 210px;
        height: 210px;
        background-image: url("assets/logo-white.svg");
        background-repeat: no-repeat;
        background-size: contain;
        background-position: center;
        opacity: 0.06;
        transform: rotate(-14deg);
        pointer-events: none;
        user-select: none;
        z-index: 0;
      }
    </style>
  </head>
  <body>
    <div class="watermark" aria-hidden="true"></div>
    <div class="layout">
      <aside id="sidebar" class="sidebar"></aside>
      <main class="main">
        <div class="topline">
          <div>
            <h1 class="title">PaynetEasy Support Hub</h1>
            <p class="subtitle">Thin shell extension. Tools are loaded from GitHub Pages on every open.</p>
          </div>
          <div class="badge" id="targetBadge">Target tab: resolving...</div>
        </div>
        <section class="panel">
          <div id="toolHeader"></div>
          <div id="toolContainer" class="loading">Loading tool registry...</div>
          <div id="status" class="status info">Ready.</div>
        </section>
      </main>
    </div>
    <div class="footer">by Aleks Rinzo</div>
    <script src="hub.js"></script>
  </body>
</html>
