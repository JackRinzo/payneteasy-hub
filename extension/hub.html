<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaynetEasy Support Hub</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-main: #0e1422;
        --bg-panel: #141d31;
        --bg-elevated: #1c2740;
        --bg-active: #26365a;
        --text-main: #e8eefc;
        --text-muted: #a9b7d7;
        --ok: #86efac;
        --error: #fda4af;
        --accent: #60a5fa;
        --border: #2b3b62;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: var(--bg-main);
        color: var(--text-main);
      }

      .layout {
        height: 100vh;
        display: grid;
        grid-template-columns: 76px minmax(360px, 1fr);
      }

      .sidebar {
        border-right: 1px solid var(--border);
        background: var(--bg-panel);
        padding: 12px 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .tool-tab {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text-main);
        border-radius: 10px;
        padding: 10px 6px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        font-size: 11px;
      }

      .tool-tab:hover {
        background: var(--bg-elevated);
      }

      .tool-tab.active {
        background: var(--bg-active);
        border-color: #3d5690;
      }

      .tool-icon {
        font-size: 20px;
        line-height: 1;
      }

      .main {
        padding: 24px 28px;
        overflow-y: auto;
      }

      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .title {
        margin: 0;
        font-size: 20px;
      }

      .subtitle {
        margin: 6px 0 0;
        color: var(--text-muted);
        font-size: 13px;
      }

      .panel {
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
      }

      .status {
        margin-top: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        background: var(--bg-elevated);
        font-size: 13px;
        min-height: 38px;
        display: flex;
        align-items: center;
      }

      .status.ok {
        color: var(--ok);
      }

      .status.error {
        color: var(--error);
      }

      .status.info {
        color: var(--text-muted);
      }

      .badge {
        font-size: 12px;
        color: var(--text-muted);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 10px;
      }

      .loading {
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <aside id="sidebar" class="sidebar"></aside>
      <main class="main">
        <div class="topline">
          <div>
            <h1 class="title">PaynetEasy Support Hub</h1>
            <p class="subtitle">Thin shell extension. Tools are loaded from GitHub Pages on every open.</p>
          </div>
          <div class="badge" id="targetBadge">Target tab: resolving...</div>
        </div>
        <section class="panel">
          <div id="toolHeader"></div>
          <div id="toolContainer" class="loading">Loading tool registry...</div>
          <div id="status" class="status info">Ready.</div>
        </section>
      </main>
    </div>
    <script src="hub.js"></script>
  </body>
</html>
