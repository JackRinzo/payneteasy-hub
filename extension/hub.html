<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaynetEasy Support Hub</title>
    <style>
      :root {
        color-scheme: light;
        --bg-main: #f2f7ff;
        --bg-panel: #ffffff;
        --bg-elevated: #edf4ff;
        --bg-active: #dbeaff;
        --text-main: #0f2a52;
        --text-muted: #5f7ea7;
        --ok: #197a46;
        --error: #b8374d;
        --accent: #2f6fda;
        --border: #c8dcfb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        position: relative;
        font-family: "Segoe UI", Arial, sans-serif;
        background: var(--bg-main);
        color: var(--text-main);
        width: 400px;
        height: 455px;
        overflow: hidden;
      }

      .layout {
        width: 400px;
        height: 455px;
        display: grid;
        grid-template-columns: 60px 1fr;
        position: relative;
        z-index: 1;
      }

      .sidebar {
        border-right: 1px solid var(--border);
        background: linear-gradient(180deg, #eff5ff 0%, #e8f1ff 100%);
        padding: 8px 6px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .tool-tab {
        border: 1px solid var(--border);
        background: #f6faff;
        color: var(--text-main);
        border-radius: 8px;
        padding: 8px 4px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 10px;
      }

      .tool-tab:hover {
        background: #e8f1ff;
      }

      .tool-tab.active {
        background: linear-gradient(180deg, #dceafe 0%, #d5e6ff 100%);
        border-color: #91b7f5;
        box-shadow: 0 0 0 1px rgba(47, 111, 218, 0.18);
      }

      .tool-icon {
        font-size: 16px;
        line-height: 1;
      }

      .main {
        padding: 8px;
        overflow: hidden;
      }

      .topline {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        margin-bottom: 8px;
      }

      .brand-logo-shell {
        height: 40px;
        padding: 4px 10px;
        border: 1px solid #6f94cb;
        border-radius: 9px;
        background: linear-gradient(180deg, #2e4f80 0%, #23436f 100%);
        box-shadow: 0 6px 14px rgba(32, 69, 122, 0.22);
        display: flex;
        align-items: center;
      }

      .brand-logo {
        width: 225px;
        height: 30px;
        background-image: url("assets/logo-white.svg");
        background-repeat: no-repeat;
        background-size: contain;
        background-position: left center;
        opacity: 1;
      }

      .subtitle {
        margin: 2px 0 0;
        color: var(--text-muted);
        font-size: 11px;
        line-height: 1.25;
      }

      .panel {
        background: var(--bg-panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px;
        box-shadow: 0 8px 20px rgba(30, 89, 176, 0.08);
      }

      #toolHeader h2 {
        color: #0f3870;
      }

      #toolHeader div {
        color: #4f6f99;
      }

      #toolContainer .tool-form label {
        color: #2a558d !important;
      }

      #toolContainer .tool-form input,
      #toolContainer .tool-form select {
        background: #edf4ff !important;
        color: #0f2f5f !important;
        border: 1px solid #9fc0ef !important;
      }

      #toolContainer .tool-form input::placeholder {
        color: #6286b6 !important;
      }

      #toolContainer .tool-form button {
        border: 1px solid #2f69c8 !important;
        background: linear-gradient(180deg, #3f82e6 0%, #2f6fd2 100%) !important;
        color: #ffffff !important;
      }

      #toolContainer .tool-note {
        color: #5d7ea9 !important;
      }

      .status {
        margin-top: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 8px;
        background: var(--bg-elevated);
        font-size: 12px;
        min-height: 30px;
        display: flex;
        align-items: center;
      }

      .status.ok {
        color: var(--ok);
      }

      .status.error {
        color: var(--error);
      }

      .status.info {
        color: var(--text-muted);
      }

      .loading {
        color: var(--text-muted);
      }

      .footer {
        position: absolute;
        bottom: 4px;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 10px;
        color: #7b95bc;
        pointer-events: none;
        z-index: 1;
      }

      .watermark {
        position: absolute;
        right: -26px;
        bottom: 12px;
        width: 210px;
        height: 210px;
        background-image: url("assets/logo-white.svg");
        background-repeat: no-repeat;
        background-size: contain;
        background-position: center;
        opacity: 0.06;
        transform: rotate(-14deg);
        pointer-events: none;
        user-select: none;
        z-index: 0;
      }
    </style>
  </head>
  <body>
    <div class="watermark" aria-hidden="true"></div>
    <div class="layout">
      <aside id="sidebar" class="sidebar"></aside>
      <main class="main">
        <div class="topline">
          <div class="brand-logo-shell">
            <div class="brand-logo" aria-label="PaynetEasy"></div>
          </div>
        </div>
        <section class="panel">
          <div id="toolHeader"></div>
          <div id="toolContainer" class="loading">Loading tool registry...</div>
          <div id="status" class="status info">Ready.</div>
        </section>
      </main>
    </div>
    <div class="footer">by Aleks Rinzo</div>
    <script src="hub.js"></script>
  </body>
</html>
