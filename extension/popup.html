<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaynetEasy Support Hub</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        width: 320px;
        padding: 16px;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #101522;
        color: #e8eefc;
      }

      .title {
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .desc {
        margin: 0 0 12px;
        font-size: 13px;
        line-height: 1.4;
        color: #b7c3e3;
      }

      .status {
        font-size: 12px;
        color: #86efac;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <div class="title">PaynetEasy Support Hub</div>
    <p class="desc">Opening the hub in a dedicated tab...</p>
    <div id="status" class="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
